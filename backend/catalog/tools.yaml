# Every tool the gateway knows. Unknown tools are denied.
#
# kind:       how the resource is matched against scopes (path | url | name | email)
# resource:   fixed resource name, or
# resource_arg / resource_template: where the resource comes from in the call's args
# egress:     the call sends data to the resource (a host or a recipient)
# output:     trusted | untrusted | by_label. Untrusted output is scanned and becomes provenance taint.
# carrier:    what kind of content an untrusted output is (pdf, email, web, tool_output, ...)

supplier_db.query: { kind: name, resource_template: "suppliers.{table}" }
files.read: { kind: path, resource_arg: path, output: by_label, carrier: pdf }
erp.create_pr: { kind: name, resource: purchase_requests.new }
erp.read_invoice: { kind: name, resource_template: "invoices.{invoice_id}" }
erp.read_pr: { kind: name, resource_template: "purchase_requests.{pr_id}" }
ledger.query: { kind: name, resource_template: "ledger.{ledger}" }
hr_db.query: { kind: name, resource_template: "employees.{table}" }
hr_db.update: { kind: name, resource_template: "employees.{table}" }
tickets.read: { kind: name, resource_template: "tickets.{ticket_id}", output: untrusted, carrier: email }
tickets.update: { kind: name, resource_template: "tickets.{ticket_id}" }
kb.search: { kind: name, resource: kb.articles }
email.send: { kind: email, resource_arg: to, egress: true }
web.fetch: { kind: url, resource_arg: url, output: untrusted, carrier: web }
http.post: { kind: url, resource_arg: url, egress: true }
payments.transfer: { kind: name, resource_template: "payments.{to_account}", egress: true }
logistics_api.track: { kind: name, resource_template: "shipments.{shipment_id}" }
