# Local stack. The database defaults to MongoDB Atlas (MONGO_URI in .env).
# Offline / no Atlas:  docker compose --profile local-db up
#   and set MONGO_URI=mongodb://mongo:27017 in .env
# Local LLM:           add --profile ollama and set OLLAMA_URL=http://ollama:11434
services:
  api:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"

  # Landing + console with hot reload. Dependencies install inside the container, never on your machine.
  web:
    image: node:22-alpine
    working_dir: /repo/web
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./web:/repo/web
      - ./backend/catalog:/repo/backend/catalog:ro
      - /repo/web/node_modules

  mongo:
    image: mongo:7
    profiles: [local-db]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  ollama:
    image: ollama/ollama
    profiles: [ollama]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  mongo-data:
  ollama-data:
